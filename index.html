<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Nubolso · Finanças Pessoais</title>
  <meta name="description" content="Controle suas finanças pessoais offline: lançamentos, orçamento, metas, contas e investimentos.">

  <meta name="theme-color" content="#121316">
  <script>
    // Aplica o tema (claro/escuro/automático) antes da primeira pintura, para evitar "flash" da cor errada.
    (function () {
      try {
        var pref = localStorage.getItem('nubolso-theme') || 'system';
        var resolved = pref === 'system'
          ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : pref;
        document.documentElement.setAttribute('data-theme', resolved);
      } catch (e) {}
    })();
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nubolso">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <!-- Aura Glass: sistema de design (tokens + componentes) — carregado antes
       do styles.css, que reaproveita os tokens --glass-* para a marca. -->
  <link rel="stylesheet" href="./css/aura-glass.css">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="glass-app">
  <div id="app">
    <header class="topbar" id="topbar"></header>
    <main id="main"></main>
  </div>

  <nav class="sidebar" id="sidebar"></nav>

  <button class="fab" id="fab" data-action="open-tx-sheet" title="Novo lançamento">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="bottomnav" id="bottomnav"></nav>

  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.49.0/dist/apexcharts.min.js" crossorigin="anonymous"></script>
  <script src="./js/db.js"></script>
  <script src="./js/charts.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
